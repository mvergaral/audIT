<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="890" viewBox="0 0 1560 890"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 2 · Levantamiento y diseño</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">2.1 · Línea base y catálogo</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Línea base de alcance, catálogo y matriz de trazabilidad</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Aprobación de la contraparte, hito H1</text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder Funcional</text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M1–M2</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A02, 1 y 2</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">2.2 · Cobertura móvil en terreno</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Mapa de cobertura móvil medida por tramo y punto de</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">carga</text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Rutas de la compañía medidas en terreno, según RT-03.24</text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">del Caso</text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Ingeniero de telecomunicaciones y campo</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M1–M3</text><text x="561" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A03, 1 a 3</text><text x="561" y="326" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">2.3 · Factibilidad con terceros</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Actas de factibilidad con los tres proveedores de</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">posicionamiento y los fabricantes</text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Respuesta escrita de cada uno sobre el acceso a sus</text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">datos</text><text x="1071" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="1071" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M1–M4</text><text x="1071" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A04, 1 a 4</text><text x="1071" y="326" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="35" y="460" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="486" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">2.4 · Arquitectura y datos</text><text x="51" y="505" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Documento de arquitectura, plan de seguridad y modelo de</text><text x="51" y="524" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">datos</text><text x="51" y="543" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="562" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Aprobación de la contraparte, hito H2</text><text x="51" y="581" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="600" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Arquitecto de Solución</text><text x="51" y="619" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M2–M4</text><text x="51" y="638" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A05, 2 a 4</text><text x="51" y="657" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="545" y="460" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="486" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">2.5 · Estudio de costo por ruta</text><text x="561" y="505" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Estudio de costo real por ruta y por contrato con datos</text><text x="561" y="524" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">históricos</text><text x="561" y="543" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="562" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Entregado a finanzas antes de la renegociación de 2027</text><text x="561" y="581" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="600" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Datos</text><text x="561" y="619" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M4–M6</text><text x="561" y="638" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: Fuera de la red, 4 a 6</text><text x="561" y="657" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-016</text></svg>