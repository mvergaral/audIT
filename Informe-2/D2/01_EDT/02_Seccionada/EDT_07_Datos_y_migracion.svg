<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="540" viewBox="0 0 1560 540"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 7 · Datos y migración</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">7.1 · Migración de vigencias</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Migración de las cerca de 6.000 vigencias</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Acta de conciliación con verificación documental de cada</text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">una</text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Datos</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M9</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A08, 6 a 9</text><text x="51" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-005</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">7.2 · Migración histórica</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Migración histórica de maestros, viajes, liquidaciones y</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">siniestros</text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Cinco años de viajes y seis de liquidaciones conciliados</text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Datos</text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M12 / M19–M24</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: 6 a 12 y 19 a 24</text><text x="561" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">7.3 · Repositorio analítico</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Repositorio analítico</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Costo por viaje en 24 horas y retención de RT-05.10</text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Datos</text><text x="1071" y="250" font-family="Arial" font-size="13" fill=