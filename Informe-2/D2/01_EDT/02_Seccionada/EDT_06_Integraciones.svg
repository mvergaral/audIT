<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="890" viewBox="0 0 1560 890"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 6 · Integraciones</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">6.1 · Sistema contable</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Interfaz con el sistema contable para el documento de</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">transporte</text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Cero folios duplicados en la prueba de reintentos</text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M9</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A10, 6 a 9</text><text x="51" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-013, RF-014, RNF-006</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">6.2 · Plataformas de posición</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Ingesta de las plataformas de posicionamiento</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Datos de cada plataforma factible en la vista única</text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M9</text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A10, 6 a 9</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-008, RNF-003</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">6.3 · Telemetría y tacógrafo</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Lectura de telemetría de fábrica y descarga de</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">tacógrafos</text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Archivo original conservado con su integridad</text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="1071" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M9</text><text x="1071" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A10, 6 a 9</text><text x="1071" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-007, RNF-005</text><rect x="35" y="460" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="486" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">6.4 · Combustible, peaje y taller</text><text x="51" y="505" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Integración de combustible, peaje y sistema de taller</text><text x="51" y="524" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="543" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Componentes de costo recibidos por viaje</text><text x="51" y="562" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="581" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="51" y="600" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M9</text><text x="51" y="619" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A10, 6 a 9</text><text x="51" y="638" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-025</text><rect x="545" y="460" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="486" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">6.5 · Sistema de 2013 y su retiro</text><text x="561" y="505" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Capa anticorrupción frente al sistema de 2013 y su</text><text x="561" y="524" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">retiro</text><text x="561" y="543" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="562" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Funciones retiradas en los meses 16 y 21 y consulta</text><text x="561" y="581" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">cerrada en el 24</text><text x="561" y="600" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="619" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="561" y="638" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M9 / M16–M24</text><text x="561" y="657" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A10, 6 a 9, y 16 a 24</text><text x="561" y="676" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text></svg>