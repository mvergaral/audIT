<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="890" viewBox="0 0 1560 890"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 11 · Implantación</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">11.1 · Capacitación</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Capacitación de torre, terminales y conductores</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Torre y terminales certificados</text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Implantación</text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M10–M12</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A13, 10 a 12</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">11.2 · Marcha blanca, Etapa 1</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Marcha blanca y paso a producción de la Etapa 1</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Seis condiciones del Art. 17.3, hitos H6 y H7</text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Implantación</text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M13–M15 / M16–M16</text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A15 y A19, 13 a 16</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RNF-011</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">11.3 · Marcha blanca, Etapa 2</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Marcha blanca y paso a producción de la Etapa 2</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Seis condiciones del Art. 17.3, hitos H11 y H12</text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Implantación</text><text x="1071" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M19–M20 / M21–M21</text><text x="1071" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A24 y A25, 19 a 21</text><text x="1071" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="35" y="460" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="486" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">11.4 · Estabilización y traspaso</text><text x="51" y="505" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Estabilización y traspaso al área de tecnología del</text><text x="51" y="524" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">mandante</text><text x="51" y="543" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="562" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: 30 días hábiles con dotación en terminales y traspaso</text><text x="51" y="581" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">certificado</text><text x="51" y="600" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="619" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Operación</text><text x="51" y="638" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M13–M15 / M16–M17</text><text x="51" y="657" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A16 y A21, 13 a 17</text><text x="51" y="676" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RNF-009</text></svg>