<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="540" viewBox="0 0 1560 540"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 4 · Equipo a bordo</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">4.1 · Firmware y gestión remota</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Firmware con operación de 72 horas y actualización en</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">terminal</text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Prueba de 72 horas sin pérdida de eventos</text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Ingeniero de firmware</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M4–M9</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A11, 4 a 9</text><text x="51" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-009, RF-014, RF-027, RNF-001, RNF-002, RNF-005,</text><text x="51" y="326" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">RNF-008</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">4.2 · Montaje camión por camión</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: 182 equipos audIT montados camión por camión</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Acta de montaje por camión sin inmovilización adicional</text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Implantación</text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M10 / M16–M18</text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A11 y A18, 6 a 10 y 16 a 18</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RNF-004</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">4.3 · Integración de terceros</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: 192 camiones de terceros en la vista única por su</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">plataforma</text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Posición recibida de cada plataforma que exporta</text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Integración</text><text x="1071" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M6–M10 / M13–M15</text><text x="1071" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A10 y A18, 6 a 10 y 13 a 15</text><text x="1071" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text></svg>