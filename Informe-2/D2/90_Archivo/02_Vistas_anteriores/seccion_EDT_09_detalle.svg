<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="540" viewBox="0 0 1560 540"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 9 · Adhesión de transportistas</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">9.1 · Anexo de adhesión</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Anexo de adhesión al contrato de transporte</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Validación jurídica del mandante</text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder Funcional</text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M2–M3</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A06, 2 a 3</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">9.2 · Campaña y enrolamiento</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Campaña y enrolamiento de transportistas</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: 104 anexos en el mes 16 y 134 en el 21</text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder Funcional</text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M2–M21</text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A06 y A18, 2 a 21</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RF-003, RF-026</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">9.3 · Medición y refuerzo</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Medición mensual y medidas de refuerzo</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Ocho indicadores mensuales y medidas activadas si el mes</text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">9 baja del 40 %</text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder Funcional</text><text x="1071" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M2–M21</text><text x="1071" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: 2 a 21</text><text x="1071" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text></svg>