<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="890" viewBox="0 0 1560 890"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT 3 · Plataforma</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">Paquetes oficiales · Entregable, aceptación, rol responsable y ventana contractual</text><rect x="35" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">3.1 · Ambientes y despliegue</text><text x="51" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Ambientes de desarrollo, calidad, preproducción,</text><text x="51" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">producción y recuperación desde código</text><text x="51" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Hito H3 con los cinco ambientes operativos</text><text x="51" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Operación</text><text x="51" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M4–M6</text><text x="51" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A07, 4 a 6</text><text x="51" y="307" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="545" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="561" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">3.2 · Seguridad e identidad</text><text x="561" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Identidad federada, bóveda de claves y cifrado de campo</text><text x="561" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Prueba de seguridad ofensiva aprobada en H5</text><text x="561" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="561" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Encargado de Seguridad de la Información</text><text x="561" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M4–M12</text><text x="561" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A07 y A12, 4 a 12</text><text x="561" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RNF-013</text><rect x="1055" y="110" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1071" y="136" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">3.3 · Observabilidad</text><text x="1071" y="155" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Trazas, métricas y registros correlacionados</text><text x="1071" y="174" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="193" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: Tablero operativo disponible en H3</text><text x="1071" y="212" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="1071" y="231" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Operación</text><text x="1071" y="250" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M4–M6</text><text x="1071" y="269" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: A07, 4 a 6</text><text x="1071" y="288" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: Alcance transversal / T-14 / T-19</text><rect x="35" y="460" width="490" height="330" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="486" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">3.4 · San Bernardo y gabinetes</text><text x="51" y="505" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Entregable: Sala de San Bernardo remediada y cuatro gabinetes de</text><text x="51" y="524" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">terminal</text><text x="51" y="543" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="562" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Aceptación: 24 horas sin enlace probadas en cada sitio</text><text x="51" y="581" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal"></text><text x="51" y="600" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Responsable: Líder de Operación</text><text x="51" y="619" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Ventana: M4–M12</text><text x="51" y="638" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Red: Paralelo a A07 a A12, 4 a 12</text><text x="51" y="657" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">Requisitos: RNF-008</text></svg>