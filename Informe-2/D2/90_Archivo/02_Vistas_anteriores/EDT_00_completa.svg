<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450"><rect width="100%" height="100%" fill="#f5f7fa"/><text x="35" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">EDT · Proyecto completo Transportes Curimón</text><text x="35" y="73" font-family="Arial" font-size="13" fill="#576b7d">13 áreas · 54 paquetes oficiales · Códigos del T-14 · Detalle de aceptación y responsable en las láminas siguientes</text><rect x="580" y="100" width="740" height="82" rx="12" fill="#17324d" stroke="#b9cbd7"/><text x="596" y="126" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">0 · Plataforma de control de jornada, flota y viaje</text><text x="596" y="145" font-family="Arial" font-size="13" fill="#ffffff" font-weight="normal">Implementación de dos etapas y operación hasta el mes 56</text><rect x="35" y="230" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="256" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">1 · Gestión del proyecto</text><text x="51" y="275" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">1.1 Dirección y control</text><text x="51" y="294" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">1.2 Interesados y comunicaciones</text><text x="51" y="313" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">1.3 Hardware del mandante</text><rect x="500" y="230" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="516" y="256" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">2 · Levantamiento y diseño</text><text x="516" y="275" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">2.1 Línea base y catálogo</text><text x="516" y="294" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">2.2 Cobertura móvil en terreno</text><text x="516" y="313" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">2.3 Factibilidad con terceros</text><text x="516" y="332" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">2.4 Arquitectura y datos</text><text x="516" y="351" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">2.5 Estudio de costo por ruta</text><rect x="965" y="230" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="981" y="256" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">3 · Plataforma</text><text x="981" y="275" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">3.1 Ambientes y despliegue</text><text x="981" y="294" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">3.2 Seguridad e identidad</text><text x="981" y="313" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">3.3 Observabilidad</text><text x="981" y="332" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">3.4 San Bernardo y gabinetes</text><rect x="1430" y="230" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1446" y="256" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">4 · Equipo a bordo</text><text x="1446" y="275" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">4.1 Firmware y gestión remota</text><text x="1446" y="294" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">4.2 Montaje camión por camión</text><text x="1446" y="313" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">4.3 Integración de terceros</text><rect x="35" y="510" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="536" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">5 · Servicios de la Etapa 1</text><text x="51" y="555" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.1 Personas y cumplimiento</text><text x="51" y="574" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.2 Flota y activos</text><text x="51" y="593" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.3 Planificación y tráfico</text><text x="51" y="612" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.4 Telemetría y geocercas</text><text x="51" y="631" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.5 Operación de fletes</text><text x="51" y="650" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.6 Liquidación y costeo</text><text x="51" y="669" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">5.7 Portal del transportista</text><rect x="500" y="510" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="516" y="536" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">6 · Integraciones</text><text x="516" y="555" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">6.1 Sistema contable</text><text x="516" y="574" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">6.2 Plataformas de posición</text><text x="516" y="593" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">6.3 Telemetría y tacógrafo</text><text x="516" y="612" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">6.4 Combustible, peaje y taller</text><text x="516" y="631" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">6.5 Sistema de 2013 y su retiro</text><rect x="965" y="510" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="981" y="536" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">7 · Datos y migración</text><text x="981" y="555" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">7.1 Migración de vigencias</text><text x="981" y="574" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">7.2 Migración histórica</text><text x="981" y="593" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">7.3 Repositorio analítico</text><rect x="1430" y="510" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1446" y="536" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">8 · Servicios de la Etapa 2</text><text x="1446" y="555" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">8.1 Portal del cliente</text><text x="1446" y="574" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">8.2 Asignación de retornos</text><text x="1446" y="593" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">8.3 Emisiones</text><text x="1446" y="612" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">8.4 Talleres y mantenimiento</text><text x="1446" y="631" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">8.5 Dispersión de rendimiento</text><rect x="35" y="790" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="816" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">9 · Adhesión de transportistas</text><text x="51" y="835" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">9.1 Anexo de adhesión</text><text x="51" y="854" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">9.2 Campaña y enrolamiento</text><text x="51" y="873" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">9.3 Medición y refuerzo</text><rect x="500" y="790" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="516" y="816" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">10 · Calidad y pruebas</text><text x="516" y="835" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">10.1 Sistema e integración</text><text x="516" y="854" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">10.2 Desempeño y seguridad</text><text x="516" y="873" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">10.3 Aceptación de usuario</text><rect x="965" y="790" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="981" y="816" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">11 · Implantación</text><text x="981" y="835" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">11.1 Capacitación</text><text x="981" y="854" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">11.2 Marcha blanca, Etapa 1</text><text x="981" y="873" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">11.3 Marcha blanca, Etapa 2</text><text x="981" y="892" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">11.4 Estabilización y traspaso</text><rect x="1430" y="790" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="1446" y="816" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">12 · Innovaciones</text><text x="1446" y="835" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">12.1 Expediente verificable del transportista</text><text x="1446" y="854" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">12.2 Despliegue continuo y modular sin detención de flota</text><text x="1446" y="873" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">12.3 Semirremolque conectado</text><text x="1446" y="892" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">12.4 Esquema de adhesión y propiedad del dispositivo</text><text x="1446" y="911" font-family="Arial" font-size="13" fill="#17324d" font-weight="normal">12.5 Bienestar del conductor y descanso en parador seguro</text><rect x="35" y="1070" width="440" height="255" rx="12" fill="#ffffff" stroke="#b9cbd7"/><text x="51" y="1096" font-family="Arial" font-size="13" fill="#17324d" font-weight="bold">13 · Operación de 36 meses</text><text x="51" y="1115" font-family="Arial" fon