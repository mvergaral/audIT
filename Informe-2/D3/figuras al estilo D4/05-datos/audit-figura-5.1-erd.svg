<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Modelo conceptual y relacional de persistencia (PostgreSQL 16)</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Entidades centrales de dominio y relaciones con integridad referencial.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Diseñado bajo Domain-Driven Design (DDD) con esquemas normalizados y auditables.</text>
<text x="24.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">TRACTOCAMION</text>
<text x="22.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_tracto (UUID)</text>
<text x="22.00" y="106.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">patente, marca, modelo</text>
<text x="22.00" y="118.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">odómetro, estado_op</text>
<text x="22.00" y="130.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">requiere_rampla (Bool)</text>
<text x="154.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">SEMIRREMOLQUE</text>
<text x="152.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_semirremolque</text>
<text x="152.00" y="106.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">patente, tipo_rampla</text>
<text x="152.00" y="118.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">capacidad_kg, refrig.</text>
<text x="152.00" y="130.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">id_baliza_ble (UUID)</text>
<text x="292.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">CONDUCTOR</text>
<text x="290.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_conductor (UUID)</text>
<text x="290.00" y="106.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">rut, nombre, contrato</text>
<text x="290.00" y="118.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">licencia, vigencia_lic</text>
<text x="290.00" y="130.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">estado_jornada (Enum)</text>
<text x="24.00" y="187.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">VIAJE (Transacción Central)</text>
<text x="22.00" y="198.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_viaje (UUID) · codigo_viaje (VJ-YYYYMM-XXXXXX)</text>
<text x="22.00" y="210.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_tracto, FK id_semirremolque, FK id_conductor</text>
<text x="22.00" y="222.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_cliente, origen_id, destino_id, peso_kg</text>
<text x="22.00" y="234.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">estado_viaje (Enum: 6 estados) · sellos UTC</text>
<text x="24.00" y="285.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">DOCUMENTO_TRANSPORTE</text>
<text x="22.00" y="296.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_documento (UUID)</text>
<text x="22.00" y="308.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_viaje, folio_sii</text>
<text x="22.00" y="320.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">hash_sha256, DET_xml</text>
<text x="22.00" y="332.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">estado_emision (Enum)</text>
<text x="154.00" y="285.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">EVIDENCIA_JORNADA</text>
<text x="152.00" y="296.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_evidencia (UUID)</text>
<text x="152.00" y="308.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_conductor, marca</text>
<text x="152.00" y="320.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">hash_actual, previo</text>
<text x="152.00" y="332.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">evidencia_rect_id</text>
<text x="292.00" y="285.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">LIQUIDACION_FLETE</text>
<text x="290.00" y="296.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_liquidacion (UUID)</text>
<text x="290.00" y="308.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_viaje, id_transp.</text>
<text x="290.00" y="320.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">costo_total, version</text>
<text x="290.00" y="332.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">id_operacion_erp</text>
<text x="16.00" y="377.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Reglas de integridad y restricciones del modelo de datos</text>
<text x="38.00" y="388.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Integridad referencial estricta (ON DELETE RESTRICT en todas las claves foráneas).</text>
<text x="38.00" y="410.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La entidad VIAJE actúa como agregado raíz que coordina el despacho y cierre operacional.</text>
<text x="38.00" y="432.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">EVIDENCIA_JORNADA y DOCUMENTO_TRANSPORTE implementan hash chains inmutables.</text>
<text x="38.00" y="454.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">LIQUIDACION_FLETE almacena fórmulas y reglas versionadas para reproducibilidad forense.</text>
<text x="38.00" y="476.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Todas las claves primarias utilizan UUIDv4 para permitir generación descentralizada en cabina.</text>
<text x="38.00" y="498.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Las marcas de tiempo utilizan TIMESTAMPTZ con estandarización obligatoria a UTC.</text>
</g>
</svg>
