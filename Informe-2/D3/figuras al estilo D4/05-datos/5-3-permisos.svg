<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Soberanía de datos, consentimiento y ciclo de vida Ley 21.719</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Base de tratamiento por titular; el permiso comercial no sustituye al laboral.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Privacidad por diseño (PbD) y destrucción criptográfica (NIST SP 800-88).</text>
<text x="24.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Conductores propios</text>
<text x="62.00" y="98.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">196 choferes</text>
<text x="62.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Art. 25 bis</text>
<text x="122.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Conductores terceros</text>
<text x="161.00" y="98.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">258 choferes</text>
<text x="161.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Subcontratados</text>
<text x="222.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Transportistas pymes</text>
<text x="260.00" y="98.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">148 pymes</text>
<text x="260.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Comercial</text>
<text x="320.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Clientes corporativos</text>
<text x="358.00" y="98.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">84 clientes</text>
<text x="358.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Destinos</text>
<text x="24.00" y="141.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Entidad CONSENTIMIENTO_DATOS y atributos de soberanía</text>
<text x="26.00" y="150.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• id_consentimiento (UUIDv4) · Clave primaria de trazabilidad legal</text>
<text x="26.00" y="164.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• comparte_posicion (Boolean) · GPS habilitado exclusivamente durante viaje activo</text>
<text x="26.00" y="178.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• comparte_telemetria (Boolean) · Lectura de odómetro y CANbus autorizada</text>
<text x="26.00" y="192.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• fecha_otorgamiento / fecha_revocacion · Sello de tiempo UTC inmutable</text>
<text x="24.00" y="231.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Borde y Cabina (Offline)</text>
<text x="24.00" y="240.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Lease temporal &lt; 5 min.</text>
<text x="24.00" y="254.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Sin renovación por API:</text>
<text x="24.00" y="266.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  inhibe GPS fuera de flete.</text>
<text x="24.00" y="280.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Botón de desconexión.</text>
<text x="24.00" y="294.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Acuse criptográfico local.</text>
<text x="226.00" y="231.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Nube y API (Soberanía)</text>
<text x="226.00" y="240.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Ejercicio derechos ARCO.</text>
<text x="226.00" y="254.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Revocación inmediata de</text>
<text x="226.00" y="266.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  visibilidad a clientes.</text>
<text x="226.00" y="280.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Bloqueo operativo seguro.</text>
<text x="226.00" y="294.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Manifiesto de excepciones.</text>
<text x="24.00" y="335.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Ciclo de vida y preservación legal de datos personales</text>
<text x="26.00" y="344.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">1. Viaje Activo: Telemetría y geocercas en caliente (TimescaleDB / Redis).</text>
<text x="26.00" y="358.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">2. Retención Obligatoria: 5 años laboral (DT), 6 años tributaria (SII), 10 años siniestros.</text>
<text x="26.00" y="372.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">3. Vencimiento Legal: Crypto-shredding irreversible (destrucción de KEK en Key Vault).</text>
<text x="26.00" y="386.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">   Conforme a NIST SP 800-88 Rev. 1, imposibilitando la recuperación de datos cifrados.</text>
<text x="16.00" y="425.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Cumplimiento normativo estricto Ley N.º 21.719</text>
<text x="38.00" y="436.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La revocación detiene transmisiones futuras pero no destruye la evidencia laboral obligatoria.</text>
<text x="38.00" y="460.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El dispositivo embarcado respeta la privacidad del chofer fuera de su turno de conducción.</text>
<text x="38.00" y="484.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cifrado a nivel de campo (FLE) con claves maestras administradas en Azure Key Vault HSM.</text>
<text x="38.00" y="508.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Transportes Curimón actúa como Responsable; audIT opera como Encargado (Art. 15 bis).</text>
</g>
</svg>
