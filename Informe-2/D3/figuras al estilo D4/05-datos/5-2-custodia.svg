<g id="iconos">
<rect x="195.86" y="196.80" width="30.28" height="9.90" fill="#FFFFFF"/>
<rect x="40.49" y="249.00" width="331.01" height="14.00" rx="3" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="0.6"/>
<text x="206.00" y="259.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Evaluación V2: Aplica reglas versionadas referenciando E1, E2 y E3 sin borrar</text>
<circle cx="26.00" cy="434.00" r="6.8" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"/>
<text x="26.00" y="437.20" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">1</text>
<circle cx="26.00" cy="458.00" r="6.8" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"/>
<text x="26.00" y="461.20" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">2</text>
