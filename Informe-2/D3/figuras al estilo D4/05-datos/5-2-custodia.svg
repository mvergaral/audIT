<circle cx="26.00" cy="506.00" r="6.8" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"/>
<text x="26.00" y="509.20" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">4</text>
</g>
<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Cadena de custodia forense append-only y rectificación</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Fuente y nivel 0-5 se conservan por separado; no prueban veracidad por sí mismos.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Inmutabilidad matemática: encadenamiento SHA-256 y bloqueo WORM (RT-16.07).</text>
<text x="24.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. Captura identificada</text>
<text x="154.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Validación de esquema</text>
<text x="292.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. Custodia inmutable</text>
<text x="22.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Conductor + fuente</text>
<text x="22.00" y="106.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Marca de tiempo UTC</text>
<text x="22.00" y="118.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Secuencia monótona</text>
<text x="22.00" y="130.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Nivel de certeza 0-5</text>
<text x="152.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Esquema Protobuf/JSON</text>
<text x="152.00" y="106.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Firma del dispositivo</text>
<text x="152.00" y="118.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Canonicalización canónica</text>
<text x="152.00" y="130.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Verificación de identidad</text>
<text x="290.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Hash previo + actual</text>
<text x="290.00" y="106.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Hash Chain SHA-256</text>
<text x="290.00" y="118.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Acuse persistente</text>
<text x="290.00" y="130.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Bloqueo append-only</text>
<text x="24.00" y="175.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Cadena de rectificación auditable (Modelo de tuplas inmutables)</text>
<text x="32.00" y="198.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">E1 / E2: Registros originales</text>
<text x="32.00" y="210.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Jornada de conducción y descanso</text>
<text x="32.00" y="222.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Evaluación V1 inicial conforme</text>
<text x="232.00" y="198.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">E3: Rectificación vinculada</text>
<text x="232.00" y="210.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• FK evidencia_rect_id -&gt; E1</text>
<text x="232.00" y="222.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Motivo auditable preservado</text>
<text x="211.00" y="204.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Enlace</text>
<text x="24.00" y="323.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Mecanismos de inmutabilidad física y lógica</text>
<text x="26.00" y="334.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Base de datos: Revocación total de UPDATE, DELETE y TRUNCATE a roles de app.</text>
<text x="26.00" y="348.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Azure Blob Storage WORM: Bloqueo de retención legal (Legal Hold) inmodificable.</text>
<text x="26.00" y="362.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Prueba negativa forense: La alteración de 1 byte rompe la cadena criptográfica.</text>
<text x="26.00" y="376.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Retención obligatoria: 5 años para jornada laboral (DT) y 6 años para DET (SII).</text>
<text x="16.00" y="425.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Garantías de validez probatoria ante fiscalización laboral</text>
<text x="38.00" y="436.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cualquier rectificación de jornada genera un nuevo registro inmutable; no sobreescribe.</text>
<text x="38.00" y="460.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La cadena de hashes SHA-256 garantiza trazabilidad inalterable ante la Dirección del Trabajo.</text>
<text x="38.00" y="484.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La falta de evidencia suficiente mantiene el bloqueo del despacho del viaje.</text>
<text x="38.00" y="508.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Exportación forense independiente con certificados y firmas públicas de verificación.</text>
</g>
</svg>
