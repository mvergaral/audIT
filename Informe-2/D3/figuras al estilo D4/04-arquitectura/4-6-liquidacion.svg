<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Liquidación trazable e integración ERP</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La liquidación conserva fuente, calidad, reglas versionadas y revisión humana.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">ERP contable de 2013 actúa como emisor único de órdenes de pago (RT-05.29).</text>
<text x="20.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. Terreno</text>
<text x="50.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Conductor / G26I</text>
<text x="102.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Evidencias</text>
<text x="134.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Jornada y Peajes</text>
<text x="188.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. Costeo</text>
<text x="219.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Liquidación audIT</text>
<text x="272.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. Revisor</text>
<text x="300.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Operaciones / QA</text>
<text x="350.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">5. ACL / ERP</text>
<text x="376.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">ERP 2013 Contable</text>
<text x="92.00" y="132.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">1. Odómetro + peajes + ticket de entrega</text>
<text x="176.50" y="164.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">2. Evidencia validada · Fuente y calidad</text>
<text x="259.50" y="228.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">3. Costo preliminar &lt; 24 h (RT-05.29)</text>
<text x="259.50" y="264.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">4. Aprobación con reglas versionadas</text>
<text x="297.50" y="300.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">5. id_operacion estable + patrón outbox</text>
<text x="297.50" y="338.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">6. Folio contable + comprobante retornado</text>
<text x="16.00" y="427.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Políticas de costeo y conciliación financiera</text>
<text x="38.00" y="438.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El cierre del viaje y las fórmulas versionadas permiten reproducir el costo exacto.</text>
<text x="38.00" y="462.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Evidencia insuficiente deja el componente en NULL y abre excepción para revisión.</text>
<text x="38.00" y="486.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El ERP 2013 es el único facultado para emitir transferencias y liquidaciones finales.</text>
<text x="38.00" y="510.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Costo consolidado disponible a 24 h; conciliación definitiva a cierre mensual.</text>
