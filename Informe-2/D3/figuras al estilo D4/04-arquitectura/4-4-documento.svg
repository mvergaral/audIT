<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Documento conforme antes del movimiento (Restricción 8)</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El ERP contable de 2013 conserva la emisión y firma exclusiva del DET.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Cotejo offline en cabina: el camión no inicia movimiento sin el archivo original.</text>
<text x="24.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. audIT Plataforma</text>
<text x="61.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Preparación viaje</text>
<text x="122.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Capa ACL</text>
<text x="158.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Traductor SOAP/XML</text>
<text x="218.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. ERP 2013</text>
<text x="257.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Emisor único tributario</text>
<text x="320.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. Dispositivo G26I</text>
<text x="359.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Cabina / Terreno</text>
<text x="109.50" y="132.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">1. Datos definitivos de carga y viaje</text>
<text x="207.50" y="164.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">2. Solicitud de folio y firma electrónica</text>
<text x="207.50" y="200.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">3. DET firmado + certificado digital SII</text>
<text x="109.50" y="236.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">4. Hash SHA-256 + acuse registrado</text>
<text x="210.00" y="272.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">5. Descarga cifrada en cabina (antes de zona sin señal)</text>
<text x="48.00" y="313.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Cotejo local en punto de carga sin cobertura</text>
<text x="50.00" y="324.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Compara pesaje de báscula + conductor efectivo vs DET firmado.</text>
<text x="50.00" y="338.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Si no coincide: rechaza inicio de marcha y emite alerta satelital.</text>
<text x="16.00" y="427.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Garantías tributarias y operacionales (Restricción 8)</text>
<text x="38.00" y="438.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Folios y certificados tributarios permanecen en el ERP 2013 (emisor único).</text>
<text x="38.00" y="462.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El dispositivo embarcado verifica la firma digital y el hash del documento localmente.</text>
<text x="38.00" y="486.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">En puntos sin cobertura, la emisión de emergencia se transmite por Iridium (&lt;= 340 bytes).</text>
<text x="38.00" y="510.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cualquier alteración en el archivo invalida el hash y activa el bloqueo de despacho.</text>
</g>
</svg>
