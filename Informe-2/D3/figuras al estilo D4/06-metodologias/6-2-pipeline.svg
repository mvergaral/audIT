<g id="iconos">
<rect x="28.21" y="119.00" width="365.58" height="14.00" rx="3" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="0.6"/>
<text x="211.00" y="129.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Artefacto único inmutable: Promoción del mismo digest SHA-256 (sin reconstrucción)</text>
<circle cx="26.00" cy="404.00" r="6.8" fill="#FFFFFF" stroke="#000000" stroke-width="0.9"/>
