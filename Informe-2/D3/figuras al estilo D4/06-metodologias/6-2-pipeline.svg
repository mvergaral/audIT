<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Pipeline DevSecOps unificado en GitLab CI Enterprise</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Integración y entrega continua con puertas de calidad bloqueantes automáticas.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Revisión por pares independiente: el autor no cuenta como revisor (Art. 4.3).</text>
<text x="24.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. Merge Request</text>
<text x="54.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">RF trazable T-12</text>
<text x="104.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Pruebas Unit.</text>
<text x="134.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">PyTest &gt;= 80 %</text>
<text x="184.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. SAST / Calidad</text>
<text x="214.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">SonarQube &#x27;A&#x27;</text>
<text x="264.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. Contenedores</text>
<text x="294.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Trivy 0 CVEs</text>
<text x="344.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">5. Firma / SBOM</text>
<text x="371.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Cosign SLSA 3</text>
<text x="24.00" y="161.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Ambientes de promoción progresiva en Azure Kubernetes Service (AKS)</text>
<text x="66.00" y="190.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">DEV</text>
<text x="66.00" y="206.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Datos sintéticos</text>
<text x="161.00" y="190.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">QA</text>
<text x="161.00" y="206.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Pruebas de carga</text>
<text x="259.00" y="190.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">PREPROD</text>
<text x="259.00" y="206.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Staging y seguridad</text>
<text x="356.00" y="190.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">PROD</text>
<text x="356.00" y="206.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Canario / Blue-Green</text>
<text x="24.00" y="259.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Mecanismo de reversión segura y resiliencia de datos</text>
<text x="26.00" y="274.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Detección automática: Si un SLI de latencia o error falla en PROD tras el despliegue,</text>
<text x="26.00" y="288.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  el cluster ejecuta rollback automático a la versión previa estable en &lt; 60 s.</text>
<text x="26.00" y="302.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Reversión de datos: Migraciones de base de datos diseñadas con scripts reversibles</text>
<text x="26.00" y="316.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  (expand/contract). Las nuevas columnas admiten nulos durante el período de prueba.</text>
<text x="26.00" y="330.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Preservación de eventos: El bus Kafka/Event Hubs retiene los eventos no procesados,</text>
<text x="26.00" y="344.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  garantizando que ningún ping telemático o viaje se pierda durante la reversión.</text>
<text x="26.00" y="358.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Aislamiento DR: Las pruebas de recuperación operan en suscripción independiente.</text>
<text x="16.00" y="395.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Políticas de seguridad DevSecOps y cumplimiento SLSA Nivel 3</text>
<text x="38.00" y="406.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Prohibición de modificaciones manuales en consola; infraestructura 100 % como código (IaC).</text>
<text x="38.00" y="428.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Escaneo obligatorio de dependencias de terceros; bloqueo ante vulnerabilidades CVE críticas.</text>
<text x="38.00" y="450.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Generación obligatoria de SBOM (Software Bill of Materials) en formato CycloneDX firmado.</text>
<text x="38.00" y="472.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Trazabilidad completa: cada imagen en producción se vincula al commit y al autor en GitLab.</text>
<text x="38.00" y="494.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Dos revisores de código obligatorios para aprobar cualquier fusión hacia la rama principal.</text>
</g>
</svg>
