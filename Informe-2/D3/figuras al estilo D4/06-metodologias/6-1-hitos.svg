<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Gobernanza temporal del proyecto y articulación de hitos</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Marco híbrido: Control contractual PMBOK + Scrum en iteraciones de 2 semanas.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Duración total: 56 meses (FEP01 Art. 17 y FEP03 Art. 17).</text>
<text x="24.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Escala temporal del contrato (Meses 1 al 56)</text>
<text x="40.00" y="92.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">M1-12</text>
<text x="110.00" y="92.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">M13-15</text>
<text x="185.00" y="92.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">M16-18</text>
<text x="255.00" y="92.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">M19-20</text>
<text x="345.00" y="92.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">M21-56</text>
<text x="24.00" y="129.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Etapa 1: Implementación del Núcleo y Flota Propia</text>
<text x="84.00" y="154.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Desarrollo Núcleo</text>
<text x="84.00" y="168.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Meses 1 al 12</text>
<text x="188.00" y="154.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Marcha blanca</text>
<text x="188.00" y="168.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M13 a M15</text>
<text x="314.00" y="154.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Operación en Régimen Etapa 1</text>
<text x="314.00" y="168.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Desde Mes 16 hasta Mes 56</text>
<text x="24.00" y="219.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Etapa 2: Integraciones Extendidas y Transportistas Terceros</text>
<text x="196.00" y="244.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Desarrollo E2</text>
<text x="196.00" y="258.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Meses 13 al 18</text>
<text x="282.00" y="244.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Marcha blanca</text>
<text x="282.00" y="258.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M19 a M20</text>
<text x="359.00" y="244.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Régimen Total</text>
<text x="359.00" y="258.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M21 a M56</text>
<text x="24.00" y="309.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Articulación de frentes simultáneos de trabajo</text>
<text x="26.00" y="324.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Ventana M13-15: Soporte/adopción de Etapa 1 en marcha blanca convive con el</text>
<text x="26.00" y="338.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  desarrollo de Etapa 2 (asignaciones de recursos y perfiles segregados).</text>
<text x="26.00" y="354.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Ventana M19-20: Producción en régimen de Etapa 1 opera en paralelo con la marcha</text>
<text x="26.00" y="368.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">  blanca de Etapa 2, compartiendo la fuente maestra y el bus de eventos común.</text>
<text x="26.00" y="382.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Sprints de software: Iteraciones de dos semanas sincronizadas con comités quincenales.</text>
<text x="16.00" y="415.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Criterios de salida y aceptación formal (Quality Gates)</text>
<text x="38.00" y="426.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Aceptación formal suscrita por la contraparte técnica de Transportes Curimón S.A.</text>
<text x="38.00" y="446.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Migración y conciliación del 100 % de las 6.000 vigencias documentales sin inconsistencias.</text>
<text x="38.00" y="466.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cero defectos críticos (Severidad 1) abiertos en el sistema de gestión de incidentes.</text>
<text x="38.00" y="486.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Prueba de recuperación ante desastres (DR) ejecutada exitosamente con RPO &lt; 15 min.</text>
</g>
