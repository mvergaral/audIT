<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Desempeño: validar actualidad antes de confirmar</text>
<text x="92.00" y="119.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Petición de despacho</text>
<text x="92.00" y="130.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">30 s máximo</text>
<text x="290.00" y="119.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Caché versionada</text>
<text x="290.00" y="130.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Identidad y vigencia</text>
<text x="562.00" y="119.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Estado autoritativo</text>
<text x="562.00" y="130.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Validar versión + reservar</text>
<text x="427.00" y="87.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Sin actualidad: consultar fuente</text>
<text x="22.00" y="238.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Consultas puntuales</text>
<text x="121.00" y="293.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">B-tree: claves y FK</text>
<text x="121.00" y="304.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Unicidad y rangos de asignación</text>
<text x="264.00" y="238.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Datos geoespaciales</text>
<text x="363.00" y="293.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">GiST: geocercas</text>
<text x="363.00" y="304.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Validar geometría y umbrales</text>
<text x="506.00" y="238.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Series y análisis</text>
<text x="606.00" y="293.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Partición temporal</text>
<text x="606.00" y="304.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">BRIN si hay orden físico</text>
<text x="24.00" y="417.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Un índice acelera una consulta; no acredita por sí solo latencia ni cobertura del caso.</text>
<text x="24.00" y="430.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Probar 380 usuarios (hipótesis), 570 en estrés y 300 reconexiones; registrar percentiles y máximos.</text>
<text x="24.00" y="443.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Viaje permanece relacional sin partición inicial; el histórico voluminoso se particiona tras medir.</text>
