<text x="78.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Cabina</text>
<text x="78.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Datos de carga</text>
<text x="220.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Operación de fletes</text>
<text x="220.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Validación</text>
<text x="366.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Capa anticorrupción</text>
<text x="366.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Adaptador contable</text>
<text x="510.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Sistema contable</text>
<text x="510.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Único emisor</text>
<text x="651.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Custodia / SII</text>
<text x="651.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Envío y respaldo</text>
<text x="149.00" y="103.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Datos definitivos · anticipados o por enlace satelital</text>
<text x="293.00" y="143.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Solicitud idempotente de emisión</text>
<text x="438.00" y="182.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Contrato de emisión homologado</text>
<text x="580.50" y="222.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Documento firmado · envío fiscal y custodia</text>
<text x="438.00" y="261.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Documento y representación del mismo contenido</text>
<text x="222.00" y="302.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Entrega completa · acuse e integridad verificados</text>
<text x="26.00" y="344.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Comprobación antes de salir</text>
<text x="26.00" y="357.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Datos de carga coinciden + documento válido disponible + representación portable conforme.</text>
<text x="26.00" y="381.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Ausencia, discrepancia o expiración del plazo: salida bloqueada; corrección y nueva evaluación.</text>
<text x="24.00" y="429.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">RT-09.01 del Caso: emisión ≤ 90 s. Un folio recibido por sí solo no habilita el traslado.</text>
<text x="24.00" y="442.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cabina y terminal conservan copias; no custodian CAF ni claves de firma del emisor.</text>
