<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Reconexión automática y conciliación por camión</text>
<text x="78.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Equipo a bordo</text>
<text x="78.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">SQLite / outbox</text>
<text x="220.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">IoT Hub</text>
<text x="220.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Identidad y cuotas</text>
<text x="366.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Event Hubs</text>
<text x="366.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Partición por equipo</text>
<text x="510.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Consumidor</text>
<text x="510.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Deduplicación</text>
<text x="651.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Persistencia</text>
<text x="651.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Acuse duradero</text>
<text x="149.00" y="101.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Reautenticar · último acuse y secuencia local</text>
<text x="149.00" y="141.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Ventana de envío + reintento con variación aleatoria</text>
<text x="149.00" y="182.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Lotes numerados · prioridad a jornada y tiempos</text>
<text x="293.00" y="222.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Admisión al flujo · aún no es confirmación final</text>
<text x="438.00" y="262.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Evento y secuencia · entrega al menos una vez</text>
<text x="580.50" y="302.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">INSERT único + conflictos auditados</text>
<text x="364.50" y="342.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Acuse después de commit · cursor confirmado</text>
<text x="78.00" y="384.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Depurar sólo lo confirmado</text>
<text x="24.00" y="429.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Caso RT-03.13: ≤ 20 min por camión tras 72 h. Perfil de prueba: 300 unidades simultáneas.</text>
<text x="24.00" y="442.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">288 h es una ampliación propuesta; requiere ensayo independiente y nunca sustituye el de 72 h.</text>
