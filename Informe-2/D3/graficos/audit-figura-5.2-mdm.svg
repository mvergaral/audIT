<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Datos maestros: propietario único y conciliación</text>
<text x="22.00" y="61.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fuentes</text>
<text x="114.00" y="121.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Contable</text>
<text x="114.00" y="133.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Identidad comercial</text>
<text x="114.00" y="227.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Documentos y contratos</text>
<text x="114.00" y="239.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Flota / personas</text>
<text x="114.00" y="333.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Gestión 2013</text>
<text x="114.00" y="345.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Fuente durante transición</text>
<text x="300.00" y="151.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Capa anticorrupción</text>
<text x="300.00" y="163.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Esquemas y claves</text>
<text x="300.00" y="315.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Validar y conciliar</text>
<text x="300.00" y="327.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Pendientes en cuarentena</text>
<text x="400.00" y="61.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Registro maestro único</text>
<text x="24.00" y="414.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cada atributo tiene un propietario; los demás contextos consumen referencias y eventos versionados.</text>
<text x="24.00" y="427.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La validación de RUT y patente es sintáctica; la acreditación documental resuelve identidad y discrepancias.</text>
<text x="24.00" y="440.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Los cambios se auditan y se concilian con el contable sin escrituras directas sobre sus tablas.</text>
