<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Asignación bloqueante del viaje</text>
<text x="78.00" y="59.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Operador / API</text>
<text x="220.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Planificación</text>
<text x="220.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">y tráfico</text>
<text x="366.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Personas / Flota</text>
<text x="366.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Servicios de validación</text>
<text x="510.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">PostgreSQL</text>
<text x="510.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Reserva y outbox</text>
<text x="651.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Bus de eventos</text>
<text x="651.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Consumidores</text>
<text x="149.00" y="101.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Orden, recursos y clave de idempotencia</text>
<text x="293.00" y="137.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Jornada, habilitaciones y aptitud · en paralelo</text>
<text x="293.00" y="173.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Veredicto + versión + evidencia</text>
<text x="23.00" y="214.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Si todas las reglas habilitan</text>
<text x="365.00" y="226.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Reserva única + asignación + outbox · una transacción</text>
<text x="365.00" y="256.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Commit confirmado</text>
<text x="149.00" y="280.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Asignación confirmada</text>
<text x="580.50" y="319.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Publicación desde outbox · entrega al menos una vez</text>
<text x="23.00" y="359.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Si hay bloqueo legal, conflicto o límite agotado</text>
<text x="149.00" y="379.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Rechazo trazable · no asignar</text>
<text x="24.00" y="429.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Techo contractual: 30 s de extremo a extremo. Presupuesto de diseño: 25 s + 5 s de margen.</text>
<text x="24.00" y="442.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">RN-04 sólo admite excepción aprobada ante fuente indisponible; nunca ante una causa legal.</text>
</g>
</svg>
