<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Modelo lógico: evidencia y evaluación de asignación</text>
<text x="22.00" y="63.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">EVIDENCIA_JORNADA</text>
<text x="22.00" y="84.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_evidencia</text>
<text x="22.00" y="96.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">fuente / estado / nivel?</text>
<text x="22.00" y="108.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">conductor? / hora?</text>
<text x="22.00" y="120.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">hash / original / rectifica?</text>
<text x="272.00" y="63.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">EVALUACION_EVIDENCIA</text>
<text x="272.00" y="84.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK (evaluacion, evidencia)</text>
<text x="272.00" y="96.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_evaluacion</text>
<text x="272.00" y="108.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_evidencia</text>
<text x="272.00" y="120.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">uso: jornada / reposo / atestación</text>
<text x="522.00" y="63.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">EVALUACION_ASIGNACION</text>
<text x="522.00" y="84.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_evaluacion</text>
<text x="522.00" y="96.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_asignacion</text>
<text x="522.00" y="108.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">modalidad / veredicto</text>
<text x="522.00" y="120.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">regla / causa / fecha</text>
<text x="220.00" y="91.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">1</text>
<text x="258.00" y="91.00" font-size="9" font-family="IBM Plex Sans" text-anchor="end" fill="#000000">0..*</text>
<text x="508.00" y="91.00" font-size="9" font-family="IBM Plex Sans" text-anchor="end" fill="#000000">1</text>
<text x="470.00" y="91.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">0..*</text>
<text x="22.00" y="270.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">DOCUMENTO_RESPALDO</text>
<text x="22.00" y="291.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_documento</text>
<text x="22.00" y="303.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">hash / origen / recibido_utc</text>
<text x="22.00" y="315.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">URI inmutable / retención</text>
<text x="272.00" y="270.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">EXCEPCION_RN04</text>
<text x="272.00" y="291.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_excepcion</text>
<text x="272.00" y="303.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FK id_evaluacion</text>
<text x="272.00" y="315.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">dos aprobadores / motivo</text>
<text x="272.00" y="327.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">un viaje / revisión mensual</text>
<text x="522.00" y="270.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">PERMISO_COMPARTIR</text>
<text x="522.00" y="291.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">PK id_permiso</text>
<text x="522.00" y="303.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">transportista / recurso / destino</text>
<text x="522.00" y="315.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">finalidad / versión / vigencia</text>
<text x="522.00" y="327.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">revocación / respaldo</text>
<text x="122.00" y="250.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">0..1</text>
<text x="122.00" y="136.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">0..*</text>
<text x="622.00" y="136.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">1</text>
<text x="372.00" y="250.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">0..1</text>
<text x="24.00" y="417.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Una evaluación usa cero o varias evidencias. Reposo y atestación pueden coexistir sin perder su origen.</text>
<text x="24.00" y="430.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Sin fuente no se inventa una evidencia. Nivel 0 es voluntario; NULL expresa ausencia o invalidez.</text>
<text x="24.00" y="443.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El permiso de compartir datos y la modalidad de adhesión no sustituyen una base legal de tratamiento.</text>
</g>
