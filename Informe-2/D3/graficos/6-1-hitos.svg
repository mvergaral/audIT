<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Gestión híbrida e hitos contractuales</text>
<text x="14.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">FEP01 · Artículo 17.1 · p.12. El detalle de actividades corresponde a S7.</text>
<text x="150.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M1</text>
<text x="245.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M6</text>
<text x="359.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M12</text>
<text x="378.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M13</text>
<text x="435.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M16</text>
<text x="492.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M19</text>
<text x="530.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M21</text>
<text x="587.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M24</text>
<text x="666.00" y="53.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">M25–56</text>
<text x="14.00" y="99.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Etapa 1</text>
<text x="264.00" y="99.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Desarrollo M1–12</text>
<text x="406.50" y="99.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Blanca</text>
<text x="520.50" y="99.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Producción desde M16</text>
<text x="663.00" y="99.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Continúa</text>
<text x="14.00" y="165.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Etapa 2</text>
<text x="435.00" y="165.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Desarrollo M13–18</text>
<text x="511.00" y="165.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Blanca</text>
<text x="568.00" y="165.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Prod. M21</text>
<text x="663.00" y="165.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Continúa</text>
<text x="14.00" y="231.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Soporte</text>
<text x="568.00" y="231.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Operación</text>
<text x="663.00" y="231.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Hasta M56</text>
<text x="22.00" y="331.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Frentes simultáneos</text>
<text x="26.00" y="346.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">M13–15: marcha blanca E1 + desarrollo E2. M19–20: producción E1 + marcha blanca E2.</text>
<text x="26.00" y="372.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Kanban: incidencias y estabilización. Ningún cambio altera los hitos obligatorios.</text>
<text x="24.00" y="426.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">SA-01 de S3/S7: M1 = febrero 2027; M16 = mayo 2028; M21 = octubre 2028; M56 = septiembre 2031.</text>
<text x="24.00" y="439.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cuatro comités y una reunión semanal gobiernan decisiones; aceptación y reversión se trazan a S9.</text>
