<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Costeo por viaje y liquidación mensual</text>
<text x="78.00" y="59.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Operación de fletes</text>
<text x="220.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Liquidación</text>
<text x="220.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">y costeo</text>
<text x="366.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Fuentes de costo</text>
<text x="366.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Combustible / peajes</text>
<text x="510.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Transportista</text>
<text x="510.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Portal y conformidad</text>
<text x="651.00" y="53.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">ACL / contable</text>
<text x="651.00" y="64.65" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Registro y acuse</text>
<text x="149.00" y="101.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Viaje cerrado · distancias, tiempos y respaldos</text>
<text x="365.00" y="143.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">v1 ≤ 24 h · componentes disponibles y faltantes</text>
<text x="293.00" y="185.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Lotes conciliados · combustible hasta 40 días</text>
<text x="365.00" y="227.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">v2…vn · costo actualizado sin sobrescribir v1</text>
<text x="365.00" y="269.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Propuesta de liquidación mensual + detalle por viaje</text>
<text x="365.00" y="305.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Aceptación firmada o discrepancia trazable</text>
<text x="435.50" y="346.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Liquidación aprobada · clave de idempotencia</text>
<text x="435.50" y="382.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Acuse contable y conciliación</text>
<text x="24.00" y="429.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El costo preliminar de un viaje y la liquidación mensual son registros distintos.</text>
<text x="24.00" y="442.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Sin acuse contable permanece pendiente; el reintento no duplica el registro financiero.</text>
