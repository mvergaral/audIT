<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Documento sin cobertura: dos caminos, un único emisor</text>
<text x="22.00" y="59.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Datos conocidos antes de entrar en la zona sin señal</text>
<text x="86.00" y="124.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Orden completa</text>
<text x="292.00" y="124.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Sistema contable</text>
<text x="292.00" y="135.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Emite y firma</text>
<text x="522.00" y="124.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Cabina</text>
<text x="522.00" y="135.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Documento y representación</text>
<text x="407.00" y="92.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Descarga y acuse verificados</text>
<text x="22.00" y="201.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Datos definitivos conocidos en el punto sin señal</text>
<text x="86.00" y="267.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Carga definitiva</text>
<text x="86.00" y="278.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Solicitud identificada</text>
<text x="292.00" y="267.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Iridium SBD</text>
<text x="292.00" y="278.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Tramas y correlación</text>
<text x="522.00" y="267.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">ACL → contable</text>
<text x="522.00" y="278.50" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Único emisor; firma original</text>
<text x="304.00" y="343.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Entrega íntegra por fragmentos + verificación + acuse</text>
<text x="24.00" y="418.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El folio o el hash solos no sustituyen el documento ni su representación portable conforme.</text>
<text x="24.00" y="431.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">SBD 9603: hasta 340 bytes de subida y 270 de bajada por mensaje; medir tamaño y tiempo total.</text>
<text x="24.00" y="444.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Emisión ≤ 90 s y documento disponible antes de salir. Si falta confirmación conforme: bloquear salida.</text>
</g>
