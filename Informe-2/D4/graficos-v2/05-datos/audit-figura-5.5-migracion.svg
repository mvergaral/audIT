<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Metodología de migración de 6.000 vigencias documentales</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Transición ordenada desde 4 planillas Excel y ERP 2013 hacia PostgreSQL.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Control de calidad en 5 fases con conciliación paralela y corte sin pérdida de datos.</text>
<text x="24.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fase 1: Extracción y Catalogación</text>
<text x="26.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">4 planillas Excel (flota, choferes, talleres, contratos) + ERP 2013</text>
<text x="26.00" y="108.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Control: Trazabilidad por fila, bitácora de anomalías y firma de aceptación</text>
<text x="24.00" y="151.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fase 2: Saneamiento y Normalización</text>
<text x="26.00" y="162.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Detección de duplicados, validación de RUT, patentes y fechas vencidas</text>
<text x="26.00" y="176.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Control: Trazabilidad por fila, bitácora de anomalías y firma de aceptación</text>
<text x="24.00" y="219.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fase 3: Validación con Padrones</text>
<text x="26.00" y="230.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cotejo con padrones oficiales (MTT, SEC, mutualidades laborales)</text>
<text x="26.00" y="244.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Control: Trazabilidad por fila, bitácora de anomalías y firma de aceptación</text>
<text x="24.00" y="287.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fase 4: Carga Atómica Versionada</text>
<text x="26.00" y="298.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Inserción con control de versiones en PostgreSQL; hash SHA-256</text>
<text x="26.00" y="312.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Control: Trazabilidad por fila, bitácora de anomalías y firma de aceptación</text>
<text x="24.00" y="355.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fase 5: Conciliación y Marcha Blanca</text>
<text x="26.00" y="366.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Operación paralela de 90 días; conciliación del 100 % antes del corte</text>
<text x="26.00" y="380.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Control: Trazabilidad por fila, bitácora de anomalías y firma de aceptación</text>
<text x="16.00" y="427.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Criterios de éxito y contingencia de corte (Rollback)</text>
<text x="38.00" y="438.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cero discrepancias permitidas en habilitaciones de conductores de sustancias peligrosas.</text>
<text x="38.00" y="462.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Las 6.000 vigencias quedan registradas con fecha de vencimiento y alerta proactiva.</text>
<text x="38.00" y="486.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Plan de rollback: Durante la marcha blanca se conserva espejo en frío del sistema legado.</text>
<text x="38.00" y="510.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Corte definitivo formalizado en acta conjunta entre Curimón y audIT (Etapa 1).</text>
</g>
</svg>
