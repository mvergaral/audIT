<text x="362.00" y="269.70" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Registro inválido o sin respaldo → cuarentena</text>
<text x="362.00" y="280.30" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">No habilita despacho; corrección trazada al origen</text>
<rect x="142.00" y="320.70" width="440.00" height="24.60" rx="3" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="0.6"/>
<text x="362.00" y="330.70" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Go / no go: totales, documentos y pruebas aceptados</text>
<text x="362.00" y="341.30" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Retorno al legado preservando lo ya emitido</text>
</g>
<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Migración: saneamiento, acreditación y conciliación</text>
<text x="22.00" y="67.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. Extraer</text>
<text x="86.00" y="129.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Inventario y copia</text>
<text x="86.00" y="141.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Perfilado de fuentes</text>
<text x="206.00" y="67.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Homologar</text>
<text x="270.00" y="129.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Claves y catálogos</text>
<text x="270.00" y="141.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Duplicados / niveles</text>
<text x="390.00" y="67.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. Acreditar</text>
<text x="454.00" y="129.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Vigencias una a una</text>
<text x="454.00" y="141.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Original y hash</text>
<text x="574.00" y="67.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. Ensayar / cortar</text>
<text x="638.00" y="129.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Conciliar y firmar acta</text>
<text x="638.00" y="141.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Delta final y reversa</text>
<text x="24.00" y="418.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Migrar todos los maestros; viajes 5 años; liquidaciones 6 años; todos los siniestros y ≈ 6.000 vigencias.</text>
<text x="24.00" y="431.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">480.000 viajes y 10.656 liquidaciones son estimaciones: confirmar contra las fuentes históricas.</text>
<text x="24.00" y="444.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cortes por función en M16 y M21. Intervenciones por unidad y terminal; respetar congelamientos de S7.</text>
</g>
