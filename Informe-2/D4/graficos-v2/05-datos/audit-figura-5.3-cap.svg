<rect x="8.00" y="8.00" width="406.00" height="52.00" rx="5" fill="#FFFFFF" stroke="#404040" stroke-width="0.75"/>
<rect x="16.00" y="68.00" width="390.00" height="86.00" rx="4" fill="#FFFFFF" stroke="#404040" stroke-width="0.75"/>
<rect x="16.00" y="162.00" width="390.00" height="86.00" rx="4" fill="#FFFFFF" stroke="#404040" stroke-width="0.75"/>
<rect x="16.00" y="256.00" width="390.00" height="86.00" rx="4" fill="#FFFFFF" stroke="#404040" stroke-width="0.75"/>
<rect x="16.00" y="350.00" width="390.00" height="74.00" rx="4" fill="#F8F9FA" stroke="#404040" stroke-width="0.75"/>
</g>
<g id="flechas">
</g>
<g id="iconos">
<rect x="37.40" y="435.00" width="347.20" height="14.00" rx="3" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="0.6"/>
<text x="211.00" y="445.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Arquitectura políglota optimizada: consistencia en negocio, resiliencia en terreno</text>
</g>
<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Clasificación de motores bajo el Teorema CAP</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Segregación técnica según consistencia, disponibilidad y tolerancia a fallos.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Diseño políglota: ningún motor asume funciones fuera de su perfil óptimo.</text>
<text x="24.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Consistencia + Tolerancia a Particiones (CP) · Transaccional</text>
<text x="26.00" y="96.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Motor: Azure Database for PostgreSQL 16 Flexible Server (Multi-AZ)</text>
<text x="26.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Dominio: Asignación bloqueante, órdenes de viaje, liquidaciones y cadena de custodia.</text>
<text x="26.00" y="124.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Garantía: Aislamiento serializable, transacciones ACID estrictas y cero doble despacho.</text>
<text x="26.00" y="138.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Conmutación: Réplica síncrona en zona de disponibilidad con RPO = 0.</text>
<text x="24.00" y="177.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Disponibilidad + Tolerancia a Particiones (AP) · Telemetría y Borde</text>
<text x="26.00" y="190.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Motores: TimescaleDB (series temporales en nube) + SQLite WAL (borde cabina)</text>
<text x="26.00" y="204.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Dominio: Ingesta masiva de 374 camiones cada 30 s, telemetría CANbus y geocercas.</text>
<text x="26.00" y="218.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Garantía: Ingesta continua garantizada; tolera hasta 72 h desconectado en frontera.</text>
<text x="26.00" y="232.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Reconciliación: Reenvío con control de versión e inserción idempotente.</text>
<text x="24.00" y="271.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Baja Latencia y Sesión · Caché en Memoria</text>
<text x="26.00" y="284.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Motor: Azure Cache for Redis Premium (Clustering Multi-AZ)</text>
<text x="26.00" y="298.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Dominio: Claves de idempotencia de 7 días, tokens de sesión y leases de permisos.</text>
<text x="26.00" y="312.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Garantía: Respuestas en &lt; 10 ms para pre-validación de despachos y auth tokens.</text>
<text x="26.00" y="326.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Respaldo: Caída de caché degrada a consulta directa en PostgreSQL sin pérdida de datos.</text>
<text x="24.00" y="365.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Almacenamiento Inmutable WORM · Archivo Legal</text>
<text x="26.00" y="376.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Motor: Azure Blob Storage con Inmutable Storage (Legal Hold)</text>
<text x="26.00" y="390.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Dominio: Documentos electrónicos DET firmados, bitácoras SHA-256 y pólizas.</text>
<text x="26.00" y="404.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Garantía: Prohibición física de borrado o sobreescritura durante el período legal.</text>
</g>
</svg>
