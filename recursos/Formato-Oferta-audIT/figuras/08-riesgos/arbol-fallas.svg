<g id="textos">
<text x="364.80" y="84.50" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Viaje asignado a un conductor no apto</text>
<text x="91.20" y="190.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Registro de jornada incompleto</text>
<text x="91.20" y="202.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">tomado como válido</text>
<text x="46.20" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Registro</text>
<text x="46.20" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">incompleto</text>
<text x="46.20" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">en el equipo</text>
<text x="136.20" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">No se muestra</text>
<text x="136.20" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">la antigüedad</text>
<text x="136.20" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">del dato</text>
<text x="273.60" y="190.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Excepción RN-04</text>
<text x="273.60" y="202.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">mal aplicada</text>
<text x="228.60" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">La torre aplica</text>
<text x="228.60" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">la excepción</text>
<text x="228.60" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">RN-04</text>
<text x="318.60" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Sin fuente caída,</text>
<text x="318.60" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">aprobación</text>
<text x="318.60" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">o registro</text>
<text x="456.00" y="190.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Asignación sin la</text>
<text x="456.00" y="202.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">reserva central</text>
<text x="411.00" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Terminal o San</text>
<text x="411.00" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Bernardo</text>
<text x="411.00" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">sin enlace</text>
<text x="501.00" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Asignación local</text>
<text x="501.00" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">sin la torre</text>
<text x="501.00" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">ni la reserva</text>
<text x="638.40" y="190.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Conductor externo aprobado</text>
<text x="638.40" y="202.50" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">sin evidencia</text>
<text x="593.40" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Transportista no</text>
<text x="593.40" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">adherido o en</text>
<text x="593.40" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">modalidad de datos</text>
<text x="683.40" y="308.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Atestación</text>
<text x="683.40" y="320.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">documental</text>
<text x="683.40" y="332.15" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">aceptada por error</text>
