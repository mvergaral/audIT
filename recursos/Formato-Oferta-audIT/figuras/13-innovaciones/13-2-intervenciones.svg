<g id="textos">
<text x="14.00" y="18.00" font-size="11" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Proceso propuesto: programar intervenciones por oportunidad de patio</text>
<text x="25.00" y="80.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. Observar</text>
<text x="122.00" y="138.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">ETA y paso por terminal</text>
<text x="122.00" y="150.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Permiso y actualidad</text>
<text x="268.00" y="80.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Preparar</text>
<text x="365.00" y="138.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Familia de equipo / kit</text>
<text x="365.00" y="150.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Versión y pruebas previas</text>
<text x="511.00" y="80.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. Programar</text>
<text x="608.00" y="138.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Ventana, técnico y stock</text>
<text x="608.00" y="150.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Prioridad + plan manual</text>
<text x="25.00" y="264.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. Autorizar</text>
<text x="122.00" y="322.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Vehículo detenido en terminal</text>
<text x="122.00" y="334.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Ventana y kit confirmados</text>
<text x="268.00" y="264.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">5. Intervenir</text>
<text x="365.00" y="322.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Configurar / instalar</text>
<text x="365.00" y="334.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Validar antes de liberar</text>
<text x="511.00" y="264.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">6. Aprender</text>
<text x="608.00" y="322.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Acta y tiempos reales</text>
<text x="608.00" y="334.00" font-size="10" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Recalibrar el próximo plan</text>
<text x="365.00" y="211.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Plan factible → confirmar ventana; si no existe, reprogramar</text>
<text x="24.00" y="423.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La instalación por unidad en terminal es obligatoria; el aporte es la planificación dinámica verificable.</text>
<text x="24.00" y="436.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Piloto: 10 unidades en M6; flota propia M6–9. Metas y línea base se miden; no se inventan resultados.</text>
<text x="24.00" y="449.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El twin conserva estado deseado/reportado. Eventos y actas guardan el historial de cada intervención.</text>
</g>
