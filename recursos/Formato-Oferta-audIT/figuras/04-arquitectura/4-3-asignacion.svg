<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Verificación de asignación y reserva atómica</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Solicitud: orden + versión conocida + clave de idempotencia (RT-02.06)</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Límite end-to-end: 30 s (RT-09.01) · Presupuesto de diseño: 25 s + 5 s de margen</text>
<text x="32.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. Identidad</text>
<text x="58.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Operador / API</text>
<text x="104.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Evidencia</text>
<text x="137.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Jornada y vigencias</text>
<text x="190.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. Reserva</text>
<text x="220.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">PostgreSQL ACID</text>
<text x="270.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. Decisión</text>
<text x="297.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Invariantes</text>
<text x="344.00" y="83.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">5. Respuesta</text>
<text x="371.00" y="104.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Outbox / Token</text>
<text x="97.50" y="152.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Valida Art. 25 bis + 6.000 vigencias</text>
<text x="178.50" y="188.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Bloqueo determinista de tracto y rampla</text>
<text x="258.50" y="224.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Aislamiento serializable confirmado</text>
<text x="24.00" y="267.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Garantías de aislamiento y concurrencia (PostgreSQL 16)</text>
<text x="24.00" y="276.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Bloqueos ordenados por ID previenen deadlocks bajo reconexión masiva.</text>
<text x="24.00" y="288.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Exclusión mutua estricta: un conductor o tracto no puede asignarse a 2 viajes.</text>
<text x="334.00" y="316.00" font-size="9" font-family="IBM Plex Sans" text-anchor="middle" fill="#000000">Invariantes OK · Commit outbox</text>
<text x="16.00" y="415.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Reglas de negocio y correlación probatoria</text>
<text x="38.00" y="428.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Sin decisión confirmada en &lt;= 30 s, el sistema bloquea preventivamente.</text>
<text x="38.00" y="454.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La reserva del activo y la evidencia laboral quedan correlacionadas por UUID.</text>
<text x="38.00" y="480.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">La clave de idempotencia se retiene 7 días en Redis y PostgreSQL (RT-02.06).</text>
<text x="38.00" y="506.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El token criptográfico autoriza el arranque del motor y la apertura de barrera.</text>
</g>
</svg>
