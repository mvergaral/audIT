<text x="295.00" y="358.30" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Token de despacho emitido</text>
<rect x="50.72" y="337.70" width="138.56" height="24.60" rx="3" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="0.6"/>
<text x="120.00" y="347.70" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">BLOQUEADO</text>
<text x="120.00" y="358.30" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="middle" fill="#000000">Sin confirmación, no hay salida</text>
