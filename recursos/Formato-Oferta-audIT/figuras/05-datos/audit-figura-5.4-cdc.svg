<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Segregación transaccional OLTP y analítica mediante CDC</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Desacoplamiento total entre transacciones críticas y consultas pesadas de BI.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Ingesta basada en logs: Debezium + Apache Kafka / Event Hubs (RT-05.05).</text>
<text x="24.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">1. OLTP</text>
<text x="24.00" y="96.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">PostgreSQL 16</text>
<text x="24.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">WAL Engine</text>
<text x="24.00" y="124.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">ACID puro</text>
<text x="122.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">2. Captura</text>
<text x="122.00" y="96.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Debezium</text>
<text x="122.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Lee el WAL</text>
<text x="122.00" y="124.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Cero impacto</text>
<text x="222.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">3. Streaming</text>
<text x="222.00" y="96.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Kafka / Event</text>
<text x="222.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Event Hubs</text>
<text x="222.00" y="124.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Bus durable</text>
<text x="326.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">4. OLAP</text>
<text x="326.00" y="96.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Delta Lake</text>
<text x="326.00" y="110.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Lakehouse</text>
<text x="326.00" y="124.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Power BI</text>
<text x="24.00" y="175.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Garantías de aislamiento operacional y latencia</text>
<text x="26.00" y="184.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Cero contención de bloqueo: Las consultas de costo por km no bloquean tablas transaccionales.</text>
<text x="26.00" y="198.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Replicación asíncrona sub-segundo: Los eventos de viaje se reflejan en el bus en &lt; 1 s.</text>
<text x="26.00" y="212.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Trazabilidad histórica completa: CDC captura inserciones, actualizaciones y estados previos.</text>
<text x="26.00" y="226.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Resiliencia ante caídas analíticas: Si el Lakehouse se detiene, el bus retiene eventos.</text>
<text x="26.00" y="240.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Formato abierto Delta Lake: Consultas reproducibles y gobernadas por OpenMetadata.</text>
<text x="26.00" y="254.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Cumple RT-05.05: Segregación física obligatoria entre bases transaccionales y analíticas.</text>
<text x="16.00" y="321.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Métricas y Acuerdos de Nivel de Servicio (SLA)</text>
<text x="38.00" y="332.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Costo por kilómetro y liquidación preliminar calculados en &lt; 24 horas (RT-05.29).</text>
<text x="38.00" y="354.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Telemetría de posición reflejada en torre de control en &lt;= 2 minutos.</text>
<text x="38.00" y="376.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Reportes de emisiones de CO2 y conciliación consolidada disponibles mensualmente.</text>
<text x="38.00" y="398.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">El motor transaccional mantiene 100 % de su CPU dedicada al despacho de camiones.</text>
</g>
</svg>
