<g id="textos">
<text x="16.00" y="23.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Gestión de Datos Maestros (MDM) y Capa Anticorrupción</text>
<text x="16.00" y="32.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">Catálogo maestro unificado y sincronización con sistemas legados.</text>
<text x="16.00" y="44.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Gobierno centralizado en OpenMetadata con diccionario de datos activo.</text>
<text x="24.00" y="83.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Tractocamiones y Ramplas</text>
<text x="26.00" y="94.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">374 tractos + 210 semirremolques · Estado y mantención</text>
<text x="26.00" y="108.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fuente maestra: audIT DataHub · ID canónico global con sincronización ACL</text>
<text x="24.00" y="151.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Conductores y Choferes</text>
<text x="26.00" y="162.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">454 conductores (196 propios + 258 externos) · Habilitaciones</text>
<text x="26.00" y="176.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fuente maestra: audIT DataHub · ID canónico global con sincronización ACL</text>
<text x="24.00" y="219.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Transportistas Terceros</text>
<text x="26.00" y="230.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">148 empresas pymes subcontratadas · Contratos y tarifas</text>
<text x="26.00" y="244.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fuente maestra: audIT DataHub · ID canónico global con sincronización ACL</text>
<text x="24.00" y="287.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Clientes y Puntos de Carga</text>
<text x="26.00" y="298.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">84 clientes corporativos · Geocercas de plantas y patios</text>
<text x="26.00" y="312.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Fuente maestra: audIT DataHub · ID canónico global con sincronización ACL</text>
<text x="16.00" y="355.00" font-size="10" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">Capa Anticorrupción (ACL) y Gobierno de Datos</text>
<text x="20.00" y="368.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Traducción bidireccional entre identificadores legados del ERP 2013 y UUIDv4.</text>
<text x="20.00" y="382.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Validación de integridad referencial antes de permitir la entrada de cualquier dato maestro.</text>
<text x="20.00" y="396.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Registro de linaje de datos (Data Lineage) auditable desde la ingesta hasta el reporte de BI.</text>
<text x="20.00" y="410.00" font-size="9" font-family="IBM Plex Sans" text-anchor="start" fill="#000000">• Notificación inmediata a supervisores ante discrepancias en padrones o vigencias.</text>
<text x="20.00" y="424.00" font-size="9" font-family="IBM Plex Sans" font-weight="600" text-anchor="start" fill="#000000">• Catálogo activo disponible 24/7 para contrapartes técnicas en el Espacio Colaborativo.</text>
