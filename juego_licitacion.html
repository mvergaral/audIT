<style>
  :root{
    --bg:#0e1526; --panel:#1a2340; --panel2:#232f52; --accent:#4da3ff; --good:#2ecc71; --bad:#e74c3c;
    --gold:#f5c542; --text:#e8eefc; --muted:#93a4c8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:radial-gradient(1200px 700px at 50% -10%, #1c2a4d 0%, var(--bg) 55%);
  }
  #app{width:100%; max-width:700px; margin:0 auto;}
  .card{background:var(--panel); border:1px solid #2b3a63; border-radius:16px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
  h1{font-size:1.6rem; letter-spacing:.5px;}
  .sub{color:var(--muted); margin-top:6px; font-size:.95rem;}
  .badge{display:inline-block; background:var(--accent); color:#04101f; font-weight:700; font-size:.72rem;
    padding:3px 10px; border-radius:20px; letter-spacing:.4px; text-transform:uppercase;}
  .badge.dev{background:var(--gold); color:#1a1200;}
  .badge.mat{background:#7c8db5; color:#0a1122;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .hud{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0;}
  .stat{background:var(--panel2); border:1px solid #2b3a63; border-radius:10px; padding:8px 14px; font-weight:700;}
  .stat small{display:block; color:var(--muted); font-weight:500; font-size:.68rem; text-transform:uppercase; letter-spacing:.5px;}
  .pts{color:var(--gold);}
  .progress{height:8px; background:#0a1122; border-radius:20px; overflow:hidden; margin:10px 0 18px;}
  .progress > div{height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); width:0%; transition:width .3s;}
  .qtext{font-size:1.15rem; line-height:1.45; margin:14px 0 18px; font-weight:600;}
  .calcnote{margin:0 0 14px; padding:10px 14px; border-radius:10px; background:#241f0d; border:1px solid #6b5a1e; color:var(--gold); font-size:.9rem;}
  .opts{display:flex; flex-direction:column; gap:11px;}
  .opt{
    background:var(--panel2); border:1.5px solid #2f3e6b; color:var(--text); text-align:left;
    padding:13px 16px; border-radius:12px; font-size:1rem; cursor:pointer; transition:.15s; line-height:1.35;
  }
  .opt:hover:not(:disabled){border-color:var(--accent); transform:translateY(-1px);}
  .opt.correct{background:var(--good); border-color:var(--good); color:#06130a; font-weight:700;}
  .opt.wrong{background:var(--bad); border-color:var(--bad); color:#1a0505; font-weight:700;}
  .opt.dim{opacity:.35;}
  .opt:disabled{cursor:default;}
  .explain{margin-top:16px; padding:14px; border-radius:10px; background:#0a1122; border:1px solid #2b3a63; font-size:.95rem;}
  .explain b{color:var(--gold);}
  .next{margin-top:18px; width:100%; padding:14px; border:none; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer;
    background:var(--accent); color:#04101f;}
  .next:hover{filter:brightness(1.08);}
  .lifelines{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .ll{flex:1; min-width:105px; background:transparent; border:1.5px solid #2f3e6b; color:var(--text);
    padding:10px; border-radius:10px; cursor:pointer; font-size:.82rem; font-weight:600;}
  .ll:hover:not(:disabled){border-color:var(--accent);}
  .ll:disabled{opacity:.3; cursor:default;}
  .title-screen h1{font-size:1.9rem;}
  .tagline{color:var(--gold); margin:6px 0 4px; font-weight:600;}
  .start{margin-top:20px; width:100%; padding:16px; border:none; border-radius:12px; font-size:1.2rem; font-weight:800; cursor:pointer;
    background:var(--gold); color:#1a1200;}
  .start:hover{filter:brightness(1.07);}
  .round-title{font-size:.9rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  .verdict{font-size:1.5rem; font-weight:800; margin:8px 0;}
  .topic-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #2b3a63;}
  .topic-row:last-child{border-bottom:none;}
  .emoji{font-size:1.7rem;}
  .center{text-align:center;}
  ul.tips{list-style:none; margin-top:12px; text-align:left;}
  ul.tips li{padding:5px 0; color:var(--muted); font-size:.9rem;}
  table.dist{width:100%; border-collapse:collapse; margin:14px 0; font-size:.85rem;}
  table.dist th, table.dist td{padding:7px 8px; border-bottom:1px solid #2b3a63; text-align:left;}
  table.dist th{color:var(--muted); font-weight:600; text-transform:uppercase; font-size:.7rem; letter-spacing:.4px;}
  .nota{font-size:2.6rem; font-weight:800; color:var(--gold);}
</style>
</head>

      {q:"Un riesgo escrito correctamente debe incluir:",o:["problema, acción correctiva y responsable","amenaza, oportunidad y disparador","probabilidad, impacto y presupuesto","causa, evento incierto y efecto sobre un objetivo"],a:"causa, evento incierto y efecto sobre un objetivo",e:"“Dado que… puede que… teniendo como consecuencia…”."},
      {q:"Frente a una amenaza, “transferir” significa:",o:["pasar la titularidad a un tercero mediante una prima","cambiar el diseño para que no exista","reducir la probabilidad o el impacto","reconocer el riesgo y no actuar"],a:"pasar la titularidad a un tercero mediante una prima",e:"Transferir = se lo paso a un tercero (subcontrato/seguro)."},
      {q:"Las cinco palancas de anticipación en una licitación son:",o:["evitar, transferir, mitigar, aceptar y escalar","identificar, analizar, responder, implementar y monitorear","consultar, suponer, excluir, rediseñar y no ofertar","planificar, ejecutar, controlar, cerrar e iniciar"],a:"consultar, suponer, excluir, rediseñar y no ofertar",e:"Las 3 primeras cuestan cero. Un riesgo sin palanca = solo “mencionado”."},
      {q:"El primer peldaño de la escalera de costo es:",o:["la decisión de arquitectura","la consulta formal en el foro","la prueba de concepto","la reserva de contingencia"],a:"la consulta formal en el foro",e:"Consultar → suponer → excluir → rediseñar → … → reparar en producción."},
      {q:"El riesgo residual se define como:",o:["el riesgo nuevo que crea la respuesta","la señal que activa la contingencia","el riesgo aceptado sin reserva","lo que queda del riesgo después de la respuesta"],a:"lo que queda del riesgo después de la respuesta",e:"Nunca es cero: por eso se financia con reserva."},
      {q:"La reserva de contingencia debe respaldarse en:",o:["la tabla de valores esperados de los riesgos","un porcentaje fijo por costumbre","el margen de utilidad de la empresa","el presupuesto de la reserva de gestión"],a:"la tabla de valores esperados de los riesgos",e:"Reserva = Σ VME, trazable. Un porcentaje al azar se lee como “colchón”."},
      {q:"Si un plan concentra sus acciones en las etapas 3 y 4:",o:["es un plan sano que anticipa el riesgo","es un plan de reparaciones, no de gestión","demuestra que usó la ventana gratuita","reduce el costo total del contrato"],a:"es un plan de reparaciones, no de gestión",e:"Lo sano es actuar en etapas 1 y 2 (propuesta/implementación)."},
      {q:"Un riesgo, además de negativo (amenaza), puede ser:",o:["un problema ya ocurrido","un evento positivo (oportunidad)","una causa conocida","una restricción del alcance"],a:"un evento positivo (oportunidad)",e:"La palabra que casi nadie lee es “positivo”. Las oportunidades bajan el precio sin bajar alcance."},
      {q:"El disparador de un riesgo es:",o:["la señal observable de que se está materializando","el responsable de vigilar el riesgo","el costo de la acción de respuesta","la etapa en que actúa la acción"],a:"la señal observable de que se está materializando",e:"Sin disparador, el plan de contingencia nunca se activa."},
      {q:"El valor monetario esperado (VME) de un riesgo con 50% de probabilidad e impacto de $6.400.000 es:",o:["$6.400.000","$3.200.000","$12.800.000","$1.280.000"],a:"$3.200.000",e:"VME = 0,50 × 6.400.000 = 3.200.000.",dev:true},
      {q:"La zona de exposición “crítica” en el curso se define como:",o:["P × I ≥ 0,40","P × I < 0,08","P × I entre 0,08 y 0,20","P × I entre 0,20 y 0,40"],a:"P × I ≥ 0,40",e:"Crítica → cambiar el diseño o no ofertar."},
    ]
  },
  {
    name:"Sala de Servidores", icon:"🖥️", points:[12,12,12],
    pool:[
      {q:"La clasificación TIER IV garantiza una disponibilidad aproximada de:",o:["99,671%","99,741%","99,982%","99,995%"],a:"99,995%",e:"TIER I 99,671 · II 99,741 · III 99,982 · IV 99,995 (~0,4 h/año)."},
      {q:"La redundancia N+1 significa:",o:["exactamente la capacidad necesaria, sin repuesto","un componente adicional sobre lo necesario","dos sistemas completos e independientes","dos sistemas completos, cada uno con repuesto"],a:"un componente adicional sobre lo necesario",e:"N+1 = un repuesto. 2N = dos sistemas completos."},
      {q:"El PUE (Power Usage Effectiveness) se calcula como:",o:["energía TI ÷ energía total de la instalación","energía total ÷ energía TI de los equipos","energía TI − energía total","energía total × energía TI"],a:"energía total ÷ energía TI de los equipos",e:"PUE = total / TI. Mientras más cerca de 1, mejor."},
      {q:"Si una instalación consume 50.000 kWh y 40.000 kWh son de equipos TI, el PUE es:",o:["0,80","1,25","2,00","1,50"],a:"1,25",e:"PUE = 50.000 / 40.000 = 1,25.",dev:true},
      {q:"Los cuatro elementos esenciales de un datacenter son:",o:["energía, clima, conectividad y seguridad física","servidores, switches, discos y UPS","agua, gas, electricidad y fibra","CPU, RAM, disco y red"],a:"energía, clima, conectividad y seguridad física",e:"El orden del diseño y del presupuesto: energía → clima → red → servidores."},
      {q:"Una unidad de rack (U) equivale a:",o:["44,45 milímetros","1 metro","19 pulgadas de ancho","88,9 milímetros"],a:"44,45 milímetros",e:"U = 44,45 mm. Un rack estándar tiene 42U."},
      {q:"En la cadena eléctrica, el UPS se encarga de:",o:["sostener la carga sin corte durante segundos/minutos","generar electricidad durante horas","bajar el consumo de los servidores","repartir la energía entre los racks"],a:"sostener la carga sin corte durante segundos/minutos",e:"El generador cubre horas; el UPS cubre el tiempo hasta que parte."},
      {q:"Un kW eléctrico consumido equivale a:",o:["un kW de calor a extraer (≈ 3.412 BTU/h)","medio kW de calor a extraer","tres kW de calor a extraer","ningún calor relevante"],a:"un kW de calor a extraer (≈ 3.412 BTU/h)",e:"Todo lo que entra como energía sale como calor que hay que sacar."},
      {q:"El confinamiento de pasillo frío y las tapas ciegas:",o:["aumentan el consumo de clima","reducen el consumo de clima entre 15% y 30%","no tienen efecto en el consumo","solo sirven para estética"],a:"reducen el consumo de clima entre 15% y 30%",e:"Es el ítem con mejor relación costo-beneficio de la sala."},
      {q:"ASHRAE TC 9.9 recomienda operar los equipos a:",o:["10–15 °C y 20–30% de humedad","18–27 °C y 40–60% de humedad","30–35 °C y 70–80% de humedad","0–5 °C y 10% de humedad"],a:"18–27 °C y 40–60% de humedad",e:"Medido en la toma de aire del equipo, no en el muro."},
      {q:"En la elevación del rack, lo más pesado (UPS y baterías) se ubica:",o:["arriba del todo","en la parte inferior","a la altura del pecho","en la parte superior trasera"],a:"en la parte inferior",e:"Baja el centro de gravedad y evita que el rack vuelque."},
      {q:"El RAID 10 se recomienda para:",o:["el disco de arranque del sistema operativo","bases de datos y carga de escritura intensa","datos temporales que se pueden regenerar","archivos de lectura esporádica"],a:"bases de datos y carga de escritura intensa",e:"RAID 10 = mejor escritura (sin paridad), 50% de capacidad útil."},
      {q:"El RAID 1 se recomienda para:",o:["bases de datos de producción","el disco de arranque del servidor","arreglos grandes de archivos","caché de datos temporales"],a:"el disco de arranque del servidor",e:"Espejo simple para el SO/hipervisor: si cae un disco, el equipo sigue arrancado."},
      {q:"Con 8 TB útiles en RAID 10 y discos de 4 TB, cuántos discos se compran (incluido el spare):",o:["4 discos","5 discos","8 discos","2 discos"],a:"5 discos",e:"RAID 10 = 50% útil → 4 discos de 4 TB dan 8 TB + 1 spare = 5 discos (factor ×2,5).",dev:true},
      {q:"La sala de servidores debe estar separada de los baños porque:",o:["el agua por filtración daña los equipos","ocupan demasiado espacio","generan ruido que afecta a los servidores","aumentan el consumo eléctrico"],a:"el agua por filtración daña los equipos",e:"Sin muro compartido y nunca en el piso superior."},
      {q:"El clima de precisión, a diferencia del de confort:",o:["controla humedad y trabaja 8.760 horas al año","solo enfría personas","se apaga de noche para ahorrar","no necesita redundancia"],a:"controla humedad y trabaja 8.760 horas al año",e:"El de confort apaga/prende y no controla humedad."},
      {q:"El tipo de UPS aceptable para una sala de servidores es:",o:["standby","línea interactiva","doble conversión (on-line)","ninguno, el generador basta"],a:"doble conversión (on-line)",e:"Es el único que filtra y sostiene sin corte perceptible."},
      {q:"El clúster de virtualización mínimo recomendado es de:",o:["un nodo","dos nodos","tres nodos","cinco nodos"],a:"tres nodos",e:"Con dos no hay dónde mover las cargas si uno cae o se mantiene."},
      {q:"La extinción con CO₂ se caracteriza por:",o:["ser segura para personas en la sala","ser letal: no se usa en recintos ocupables","ser el agente más barato para salas ocupadas","no afectar el oxígeno del ambiente"],a:"ser letal: no se usa en recintos ocupables",e:"Desplaza el oxígeno. Para salas ocupables se usan FM-200 o Novec 1230."},
    ]
  },
];

const MAX_POINTS = 225;

let state = {ti:0, qi:0, pool:[], score:0, lives:3, perTopic:[], asked:[]};
let lifelines = {fifty:true, skip:true, expert:true};
let currentQ = null, currentPts = 0, answered = false;

const app = document.getElementById('app');
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function buildRound(){
  const t = TOPICS[state.ti];
  const drawn = shuffle(t.pool).slice(0, t.points.length);
  state.pool = drawn.map((q,i)=>({...q, pts:t.points[i]}));
  state.qi = 0;
  showQuestion();
}

function showQuestion(){
  if(state.qi >= state.pool.length){ return endRound(); }
  const raw = state.pool[state.qi];
  currentPts = raw.pts;
  const opts = shuffle(raw.o.map(txt=>({txt, ok: txt===raw.a})));
  currentQ = {raw, opts};
  answered = false;
  render();
}

function pick(oi){
  if(answered) return;
  const opt = currentQ.opts[oi];
  opt.selected = true; answered = true;
  state.asked[state.ti]++;
  if(opt.ok){ state.score += currentPts; state.perTopic[state.ti] += currentPts; opt.cls='correct'; }
  else { state.lives--; opt.cls='wrong'; currentQ.opts.forEach(o=>{ if(o.ok) o.cls='correct'; else o.cls='dim'; }); }
  render();
  if(state.lives<=0) setTimeout(endGame, 1400);
}

function next(){ state.qi++; if(state.lives<=0) return endGame(); showQuestion(); }

function endRound(){
  if(state.ti < TOPICS.length-1){ state.ti++; renderRoundBreak(); }
  else endGame();
}

function useLifeline(kind){
  if(answered) return;
  if(kind==='fifty' && lifelines.fifty){
    lifelines.fifty=false;
    shuffle(currentQ.opts.filter(o=>!o.ok)).slice(0,2).forEach(o=>o.hidden=true);
    render();
  } else if(kind==='skip' && lifelines.skip){
    lifelines.skip=false;
    const t = TOPICS[state.ti];
    const fresh = t.pool.filter(x=>!state.pool.some(p=>p.q===x.q));
    if(fresh.length){ const nq=fresh[Math.floor(Math.random()*fresh.length)]; state.pool[state.qi] = {...nq, pts: currentPts}; }
    showQuestion();
  } else if(kind==='expert' && lifelines.expert){
    lifelines.expert=false;
    const ok = currentQ.opts.find(o=>o.ok);
    ok.cls='correct'; answered=true; state.asked[state.ti]++;
    state.score += currentPts; state.perTopic[state.ti] += currentPts;
    render();
    if(state.lives<=0) setTimeout(endGame,1400);
  }
}

function render(){
  const t = TOPICS[state.ti];
  const total = state.pool.length;
  const done = state.qi;
  const pct = Math.round(done/total*100);
  const raw = currentQ.raw;

  let optHtml = currentQ.opts.map((o,oi)=>{
    let cls='opt'; if(o.cls) cls+=' '+o.cls; if(o.hidden) cls+=' dim';
    return `<button class="${cls}" ${answered?'disabled':''} onclick="pick(${oi})">${o.hidden?'—':o.txt}</button>`;
  }).join('');

  let explain='';
  if(answered){
    const won = currentQ.opts.find(o=>o.selected && o.ok);
    explain=`<div class="explain">${won?'✅ ¡Correcto!':'❌ Incorrecto.'} <b>${raw.a}</b> — ${raw.e}</div>`;
  }

  const calcNote = raw.dev ? `<div class="calcnote">✍️ Ítem CON DESARROLLO — haz el cálculo antes de responder (en el control puedes usar calculadora simple).</div>` : '';
  const badge = raw.dev ? '<span class="badge dev">✍️ desarrollo</span>' : '<span class="badge mat">📝 materia</span>';
  const nextBtn = answered ? `<button class="next" onclick="next()">${state.qi+1>=total?'Continuar':'Siguiente'}</button>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="row">
        <div><span class="badge">${t.icon} ${t.name}</span> ${badge}</div>
        <div class="round-title">Pregunta ${state.qi+1} de ${total} · vale <b class="pts">${currentPts} pts</b></div>
      </div>
      <div class="hud">
        <div class="stat pts">${state.score} <small>puntaje / 225</small></div>
        <div class="stat">${'🔋'.repeat(state.lives)||'—'} <small>reserva (vidas)</small></div>
        <div class="stat">Tema ${state.ti+1}/5</div>
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="qtext">${raw.q}</div>
      ${calcNote}
      <div class="opts">${optHtml}</div>
      ${explain}
      <div class="lifelines">
        <button class="ll" ${lifelines.fifty&&!answered?'':'disabled'} onclick="useLifeline('fifty')">✂️ 50:50</button>
        <button class="ll" ${lifelines.skip&&!answered?'':'disabled'} onclick="useLifeline('skip')">📨 Consulta al foro</button>
        <button class="ll" ${lifelines.expert&&!answered?'':'disabled'} onclick="useLifeline('expert')">🧑‍💼 Llamar al experto</button>
      </div>
      ${nextBtn}
    </div>`;
}

function renderRoundBreak(){
  const t = TOPICS[state.ti-1];
  const p = state.perTopic[state.ti-1];
  const max = t.points.reduce((a,b)=>a+b,0);
  const a = state.asked[state.ti-1];
  app.innerHTML = `
    <div class="card center">
      <div class="emoji">${state.lives<=0?'💥':'🎉'}</div>
      <div class="round-title">${t.name} completado</div>
      <div class="verdict">${p} / ${max} puntos</div>
      <p class="sub">${a} preguntas respondidas.</p>
      <button class="start" onclick="buildRound()">▶️ Siguiente tema</button>
    </div>`;
}

function endGame(){
  const s = state.score;
  const pct = Math.round(s/MAX_POINTS*100);
  const nota = Math.max(1, Math.min(7, 1 + 6*(s/MAX_POINTS))).toFixed(1);
  let emoji, verdict, tip;
  if(state.lives<=0){ emoji='💥'; verdict='Prueba anulada'; tip='Se te agotó la reserva de contingencia. En el control no hay vidas: no dejes tantas en blanco.'; }
  else if(pct>=85){ emoji='🏆'; verdict='¡Nivel excelente!'; tip='Estás listo para el control.'; }
  else if(pct>=70){ emoji='🥈'; verdict='¡Muy bien!'; tip='Buena base, repasa los detalles de los temas con menos puntos.'; }
  else if(pct>=50){ emoji='📉'; verdict='Va por la mitad'; tip='Repasa los temas donde fallaste (mira la tabla de abajo).'; }
  else { emoji='😅'; verdict='A estudiar'; tip='Dale una vuelta al resumen y vuelve a intentar.'; }

  const rows = TOPICS.map((t,i)=>`
    <div class="topic-row"><span>${t.icon} ${t.name}</span><span><b>${state.perTopic[i]} / ${t.points.reduce((a,b)=>a+b,0)}</b></span></div>`).join('');

  app.innerHTML = `
    <div class="card center">
      <div class="emoji">${emoji}</div>
      <div class="verdict">${verdict}</div>
      <div class="nota">${nota}</div>
      <div class="sub">nota aproximada (escala 1.0–7.0)</div>
      <div class="sub" style="margin-top:8px"><b>${s} / ${MAX_POINTS} puntos</b> (${pct}%)</div>
      <div style="margin:16px 0; text-align:left">${rows}</div>
      <p class="sub">${tip}</p>
      <button class="start" onclick="location.reload()">🔁 Jugar de nuevo</button>
    </div>`;
}

function titleScreen(){
  const rows = TOPICS.map((t,i)=>`<tr><td>${t.icon} ${t.name}</td><td>${t.points.length} ítems</td><td>${t.points.reduce((a,b)=>a+b,0)} pts</td></tr>`).join('');
  app.innerHTML = `
    <div class="card title-screen">
      <div class="center">
        <div class="badge">Simulador oficial del Control 1 · FEP</div>
        <h1 style="margin-top:12px">CONTROL 1</h1>
        <p class="tagline">18 ítems · 225 puntos · 5 temas</p>
        <table class="dist">
          <thead><tr><th>Tema</th><th>Ítems</th><th>Puntaje</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <ul class="tips">
          <li>📝 <b>Alternativas de materia</b> y ✍️ <b>con desarrollo</b> (cálculo), igual que en la pauta real.</li>
          <li>🔋 Tienes <b>3 vidas</b> (tu reserva de contingencia) y <b>3 comodines</b>.</li>
          <li>🧮 Puedes usar calculadora simple, como en el control de verdad.</li>
          <li>📚 Aunque falles, te mostramos la explicación para que aprendas.</li>
        </ul>
        <button class="start" onclick="start()">🚀 Empezar simulación</button>
      </div>
    </div>`;
}

function start(){
  state = {ti:0, qi:0, pool:[], score:0, lives:3, perTopic:TOPICS.map(()=>0), asked:TOPICS.map(()=>0)};
  lifelines = {fifty:true, skip:true, expert:true};
  buildRound();
}

titleScreen();
</script>
</body>
</html>
