le="" x="-130" y="-54" width="260" height="108"/><g class="label" style="" transform="translate(-100, -39)"><rect/><foreignObject width="200" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>TOLERANCIA A PARTICIONES (P)<br />Obligatoria por diseño distribuido<br />(Ruta 5 Norte, Zonas de Sombra, Multi-AZ Cloud)</p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-CP_CORE-1" data-look="classic" transform="translate(548, 235.375)"><rect class="basic label-container" style="" x="-130" y="-122.25" width="260" height="244.5"/><g class="label" style="" transform="translate(-100, -107.25)"><rect/><foreignObject width="200" height="214.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>PostgreSQL 16 Multi-AZ + PostGIS<br />• Validación Bloqueante de Despacho (RT-09.01)<br />• Integridad de ~6.000 Vigencias Legales<br />• Asientos Financieros y DTE<br />• Regla: Es preferible abortar o encolar el despacho<br />que autorizar un viaje con chofer sin descanso<br />o camión sin revisión técnica.</p></span></div></foreignObject></g></g><g class="node default  " id="mermaid-svg-flowchart-AP_TELEMETRIA-2" data-look="classic" transform="translate(1109.609375, 466.875)"><rect class="basic label-container" style="" x="-130" y="-132" width="260" height="264"/><g class="label" style="" transform="translate(-100, -117)"><rect/><foreignObject width="200" height="234"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>TimescaleDB / Kafka + SQLite Embarcado<br />• Ingesta Continua de Pings GPS (41M km/año)<br />• Operación Desconectada 72h a Bordo (T-19)<br />• Regla: La telemetría nunca bloquea al camión.<br />Se acumula en búfer local y sincroniza vía<br />Consistencia Eventual (BASE) al recuperar red.</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="mermaid-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mermaid-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="mermaid-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient></svg>